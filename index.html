<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Website Design</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="" />
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="./resources/styles/reset.css">
  <link rel="stylesheet" href="resources/styles/styles.css">
</head>
<body>
    <main>
        <h1>Website Design Project</h1>
        <section>
            <div class="container">
                <div class="color-display red">
                    <div>
                        <p>Red</p>
                        <p>rgb(255, 0, 0)</p>
                        <p>Used for critical messaging</p>
                    </div>
                </div>
                <div class="color-display green">
                    <div>
                        <p>Green</p>
                        <p>rgb(0, 255, 0)</p>
                        <p>Can represent growth and finances</p>
                    </div>
                </div>
                <div class="color-display blue">
                    <div>
                        <p>Blue</p>
                        <p>rgb(0, 0, 255)</p>
                        <p>A calming color for general use</p>
                    </div>
                </div>
                <div class="color-display yellow">
                    <div>
                        <p>Yellow</p>
                        <p>rgb(255, 255, 0)</p>
                        <p>A noticable color that lightens up places</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
